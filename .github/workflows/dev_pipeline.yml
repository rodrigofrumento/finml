name: Fin-ML API Pipeline

on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ dev ]

permissions:
  contents: read
  packages: write
  security-events: write

env:
  PY_VERSION: '3.13'

jobs:
  # ---------- DEV BRANCH ----------
  dev_lint_format_trivy:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Set up Python ${{ env.PY_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PY_VERSION }}
        
      - name: Cache poetry & pip
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.cache/pypoetry
          key: poetry-${{ runner.os }}-${{ env.PY_VERSION }}-${{ hashFiles('backend/poetry.lock') }}
          restore-keys: |
            poetry-${{ runner.os }}-${{ env.PY_VERSION }}-

      - name: Install poetry
        run: |
          pip install -U pip
          pip install poetry
          poetry --version
      
      - name: Install deps (no venv)
        run: |
          poetry config virtualenvs.create false
          poetry install --no-interaction --no-ansi --no-root
      
      # Black and Flake - Lint & format (check only)
      - name: Black (check)
        run: black --check .
      
      - name: Flake8
        run: flake8 .
      
      # Build Local image and Trivy
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build image (local)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          platforms: linux/amd64
          load: true
          tags: finml-api:dev-scan
          build-args: |
            BUILD_TS=${{ github.run_id }}
      
      - name: Trivy scan
        uses: aquasecurity/trivy-action@v0.33.1
        with:
          image-ref: finml-api:dev-scan
          format: table
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
