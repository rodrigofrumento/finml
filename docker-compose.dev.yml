services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: finml-api:dev
    container_name: finml-api
    user: "0:0"
    environment:
      - PORT=8000
      # yfinance tuning
      - YF_PERIOD=5y
      - YF_INTERVAL=1d
      - PYTHONPATH=/app
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app
    command: >
      uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
